name: smdt
description: "Flutter plugin for SMDT library."
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.altcode.smdt
        pluginClass: SmdtPlugin

  assets:
    - android/src/main/assets/smdt_new.jar
    - android/src/main/assets/smdt_old.jar